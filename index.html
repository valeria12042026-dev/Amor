<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mía - Te Extraño</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- TEXTO SUPERIOR CON PARPADEO --- */
        .header-text {
            position: absolute;
            top: 12%;
            color: rgba(255, 255, 255, 0.8);
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            width: 90%;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 10;
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 0.9; transform: scale(1); }
        }

        /* --- ICONO TRISTE (REEMPLAZO DE ALBUM) --- */
        .sad-icon-container {
            margin-bottom: 40px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .broken-heart {
            width: 80px;
            height: 80px;
            fill: #444; /* Gris oscuro */
            animation: pulse-slow 3s infinite;
        }

        @keyframes pulse-slow {
            0% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.1); opacity: 0.6; }
            100% { transform: scale(1); opacity: 0.4; }
        }

        /* --- CAJA DE LOGIN --- */
        .login-box {
            position: relative;
            z-index: 100;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }

        #password {
            width: 100%;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
            text-align: center;
            border-radius: 30px; /* Estilo más moderno y suave */
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        #password:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #password::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-ingresar {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background-color: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-ingresar:active {
            background: white;
            color: black;
        }

        /* --- CARITAS TRISTES --- */
        .sad-face {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            animation: float-up-sad linear forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255, 255, 255, 0.2);
        }

        @keyframes float-up-sad {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.4; }
            100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
        }

        /* --- VIDEO OCULTO --- */
        #videoOculto { display: none; }
    </style>
</head>
<body onclick="iniciarAudio(event)">

    <h1 class="header-text">MÍA TE EXTRAÑO</h1>

    <video id="videoOculto" loop>
        <source src="lolo.mp4" type="video/mp4">
    </video>

    <div class="login-box">
        <div class="sad-icon-container">
            <svg class="broken-heart" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z M12 6.5l-1-1 M13 18l-2-2 M15 11l-3 3"/>
            </svg>
        </div>

        <input type="password" id="password" placeholder="Contraseña">
        <button class="btn-ingresar" onclick="validateLogin()">ENTRAR</button>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const video = document.getElementById('videoOculto');
        let audioIniciado = false;

        function iniciarAudio(e) {
            if (!audioIniciado) {
                video.play();
                audioIniciado = true;
            }
            createSadFace(e.clientX, e.clientY);
        }

        function validateLogin() {
            if (passwordInput.value === "timotito11") {
                window.location.href = "index2.html";
            } else {
                passwordInput.value = "";
                passwordInput.placeholder = "Incorrecto...";
                setTimeout(() => { passwordInput.placeholder = "Contraseña"; }, 2000);
            }
        }

        function createSadFace(x, y) {
            const container = document.createElement('div');
            container.className = 'sad-face';
            container.style.left = x + 'px';
            container.style.top = y + 'px';
            container.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            container.innerHTML = `☹️`;

            const duration = Math.random() * 3 + 5;
            container.style.animationDuration = duration + 's';
            document.body.appendChild(container);
            setTimeout(() => container.remove(), duration * 1000);
        }

        // Caritas que suben solas
        setInterval(() => {
            const x = Math.random() * window.innerWidth;
            createSadFace(x, window.innerHeight + 50);
        }, 2000);
    </script>
</body>
</html>
