<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Compartida | Ayber</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --accent: #0a84ff;
            --text: #ffffff;
            --text-sec: #8e8e93;
            --green: #32d74b;
        }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* OVERLAY DE USUARIO */
        #user-selector-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 5000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }

        /* HEADER */
        .header { padding: 40px 20px 10px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 100; }
        .hamburger { font-size: 24px; cursor: pointer; color: var(--accent); background: none; border: none; z-index: 1100; }
        
        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--card); z-index: 1000; transition: 0.3s;
            padding-top: 80px; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        .sidebar.active { left: 0; }
        .sidebar-item { padding: 18px 25px; font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #2c2c2e; }
        
        /* BLOQUEO Y FLECHA */
        .disabled-item { opacity: 0.3; cursor: not-allowed !important; pointer-events: none; }
        .pointer-arrow { 
            margin-left: auto; 
            animation: point-left 0.8s infinite alternate; 
            color: var(--accent);
            font-weight: bold;
        }
        @keyframes point-left { from { transform: translateX(0); } to { transform: translateX(-10px); } }

        /* SECCIONES */
        .view-section { display: none; padding: 0; animation: fadeIn 0.3s; }
        .view-section.active { display: block; }
        
        /* WHATSAPP CHANCHITO */
        #chat-view { padding: 20px; display: flex; flex-direction: column; height: 85vh; }
        #chat-container { flex: 1; overflow-y: auto; background: #000; border-radius: 20px; padding: 15px; border: 1px solid #2c2c2e; margin-bottom: 15px; display: flex; flex-direction: column; }
        .msg { margin-bottom: 10px; padding: 12px 16px; border-radius: 18px; max-width: 80%; word-wrap: break-word; font-size: 15px; position: relative; }
        .msg.sent { background: #005c4b; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .msg.received { background: #202c33; align-self: flex-start; color: white; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; gap: 10px; padding-bottom: 20px; }
        .chat-input-area input { flex: 1; background: var(--card); border: none; padding: 15px; border-radius: 20px; color: white; outline: none; }
        
        .save-btn { background: var(--accent); color: white; border: none; width: 100%; padding: 16px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="user-selector-overlay">
        <h2 style="margin-bottom:30px">¿Quién eres?</h2>
        <button class="save-btn" onclick="setUser('Ayber')" style="margin-bottom: 20px; width: 200px;">Soy Ayber</button>
        <button class="save-btn" onclick="setUser('Valeria')" style="background: #ff375f; width: 200px;">Soy Mia</button>
    </div>

    <div class="header">
        <button class="hamburger" id="hamBtn" onclick="toggleSidebar()">☰</button>
        <h1 id="view-title">Menú</h1>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-item disabled-item">📅 Calendario</div>
        <div class="sidebar-item" id="chat-option" onclick="navigate('chat')" style="border-left: 4px solid var(--accent); background: rgba(10, 132, 255, 0.1);">
            🐷 WhatsApp Chanchito <span class="pointer-arrow">⬅️</span>
        </div>
        <div class="sidebar-item disabled-item">🔔 Notificaciones</div>
    </div>

    <div id="section-calendar" class="view-section"></div>

    <div id="section-chat" class="view-section">
        <div id="chat-view">
            <div id="chat-container"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
                <button class="save-btn" onclick="sendChatMessage()" style="width: auto; padding: 10px 20px;">Enviar</button>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://ckiozwumzoqcyfbiazjf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6JzDCmB92cBB_tqmJLnGEg_-JpP3MuG';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let miUsuario = "";
    let systemLocked = true; // Bloqueo inicial

    function setUser(nombre) {
        miUsuario = nombre;
        document.getElementById('user-selector-overlay').style.display = 'none';
        
        // Notificación de entrada
        setTimeout(() => {
            alert("🔔 Ayber te ha enviado un mensaje");
            // Forzar apertura de menú y señalar el chat
            document.getElementById('sidebar').classList.add('active');
        }, 500);

        initChatSystem();
    }

    function toggleSidebar() { 
        // Solo permite cerrar si ya no está bloqueado (opcional, aquí lo mantengo abierto)
        if(!systemLocked) {
            document.getElementById('sidebar').classList.toggle('active'); 
        }
    }

    function navigate(section) {
        if (section === 'chat') {
            // Al entrar al chat por primera vez, desactivamos la flecha y el bloqueo si deseas
            systemLocked = false;
            document.querySelector('.pointer-arrow').style.display = 'none';
            document.getElementById('sidebar').classList.remove('active');
            
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`section-chat`).classList.add('active');
            document.getElementById('view-title').innerText = 'Chanchito Chat';
            
            // Habilitar las otras opciones tras entrar al chat
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('disabled-item'));
        }
    }

    // --- SISTEMA DE CHAT ---
    async function initChatSystem() {
        const { data } = await _supabase.from('mensajes').select('*').order('created_at', { ascending: true });
        const container = document.getElementById('chat-container');
        container.innerHTML = ""; 
        if(data) {
            data.forEach(m => drawMessage(m));
            container.scrollTop = container.scrollHeight;
        }

        _supabase.channel('mensajes-realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, (payload) => {
            drawMessage(payload.new);
            container.scrollTop = container.scrollHeight;
        }).subscribe();
    }

    function drawMessage(m) {
        const container = document.getElementById('chat-container');
        if (document.getElementById(`msg-${m.id}`)) return;
        const esMio = (m.user === miUsuario);
        const msgDiv = document.createElement('div');
        msgDiv.id = `msg-${m.id}`;
        msgDiv.className = `msg ${esMio ? 'sent' : 'received'}`;
        msgDiv.innerHTML = `${m.text}<small style="font-size:10px; opacity:0.6; display:block; text-align:right; margin-top:5px;">${m.time}</small>`;
        container.appendChild(msgDiv);
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        if(!input.value.trim()) return;
        const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        await _supabase.from('mensajes').insert([{ user: miUsuario, text: input.value, time: now }]);
        input.value = "";
    }
</script>
</body>
</html>
